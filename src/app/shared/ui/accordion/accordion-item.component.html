<h3 class="accordion-item__header">
  <!--
    aria-label only overrides the name for the plain-text trigger. A custom
    trigger's visible content (tags, dates, status) must stay part of the
    accessible name too, or it fails WCAG 2.5.3 Label in Name — so we let the
    browser compute the name from the projected content instead of the title.
  -->
  <button
    type="button"
    class="accordion-item__trigger"
    [id]="triggerId"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="panelId"
    [attr.aria-label]="hasCustomTrigger() ? null : title()"
    (click)="toggle()"
  >
    @if (hasCustomTrigger()) {
      <ng-content select="[accordion-trigger]" />
    } @else {
      {{ title() }}
    }
    @if (expandHint()) {
      <span class="accordion-item__hint">
        {{ expanded() ? collapseHint() : expandHint() }}
      </span>
    }
    <svg
      class="accordion-item__chevron"
      aria-hidden="true"
      viewBox="0 0 16 16"
      width="16"
      height="16"
    >
      <path
        d="M4 6l4 4 4-4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</h3>
<div
  class="accordion-item__panel"
  [id]="panelId"
  role="region"
  [attr.aria-labelledby]="triggerId"
  [hidden]="!expanded()"
>
  <ng-content />
</div>
