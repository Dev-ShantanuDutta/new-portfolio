@if (isLink()) {
  <a
    class="pill-button"
    [class]="classes()"
    [href]="href()"
    [attr.target]="newTab() ? '_blank' : null"
    [attr.rel]="newTab() ? 'noopener noreferrer' : null"
    [attr.aria-label]="newTab() ? label() + ' (opens in new tab)' : null"
  >
    @if (icon()) {
      <span class="pill-button__icon" aria-hidden="true">{{ icon() }}</span>
    }
    <span class="pill-button__label">{{ label() }}</span>
    @if (newTab()) {
      <span class="pill-button__external" aria-hidden="true">↗</span>
    }
  </a>
} @else {
  <button type="button" class="pill-button" [class]="classes()" (click)="clicked.emit()">
    @if (icon()) {
      <span class="pill-button__icon" aria-hidden="true">{{ icon() }}</span>
    }
    <span class="pill-button__label">{{ label() }}</span>
  </button>
}
