<span class="tech-badge">
  @if (icon()) {
    <span class="tech-badge__icon-chip" aria-hidden="true">
      <img
        class="tech-badge__icon"
        [src]="'assets/icons/' + icon() + '.svg'"
        alt=""
        width="12"
        height="12"
      />
    </span>
  }
  <span class="tech-badge__name">{{ name() }}</span>
</span>
