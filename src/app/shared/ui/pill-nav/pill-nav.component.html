<nav class="pill-nav" aria-label="Primary">
  <ul #list class="pill-nav__list">
    <li #indicator class="pill-nav__indicator" aria-hidden="true"></li>
    @for (link of links(); track link.label; let i = $index) {
      <li class="pill-nav__item">
        @if (link.href) {
          <a #navLink class="pill-nav__link" [href]="link.href">{{ link.label }}</a>
        } @else if (link.fragment) {
          <a
            #navLink
            class="pill-nav__link"
            [class.pill-nav__link--current]="i === activeIndex()"
            [attr.aria-current]="i === activeIndex() ? 'true' : null"
            [routerLink]="link.routerLink ?? '/'"
            [fragment]="link.fragment"
            >{{ link.label }}</a
          >
        } @else {
          <a
            #navLink
            class="pill-nav__link"
            [routerLink]="link.routerLink"
            routerLinkActive="pill-nav__link--active"
            >{{ link.label }}</a
          >
        }
      </li>
    }
  </ul>
</nav>
