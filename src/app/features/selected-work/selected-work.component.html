<section id="selected-work" class="selected-work">
  <div class="selected-work__tabs" role="tablist" aria-label="Project type">
    @for (tab of tabs; track tab.origin; let i = $index) {
      <button
        type="button"
        role="tab"
        class="selected-work__tab"
        [class.selected-work__tab--active]="selected() === tab.origin"
        [id]="'projects-tab-' + tab.origin"
        [attr.aria-selected]="selected() === tab.origin"
        aria-controls="projects-panel"
        [tabIndex]="selected() === tab.origin ? 0 : -1"
        (click)="selected.set(tab.origin)"
        (keydown)="onTabKeydown($event, i)"
      >
        {{ tab.label }}
        <span class="selected-work__count">{{ counts()[tab.origin] }}</span>
      </button>
    }
  </div>

  <div id="projects-panel" role="tabpanel" [attr.aria-labelledby]="'projects-tab-' + selected()">
    <app-accordion>
      @for (project of visibleProjects(); track project.slug) {
        <app-project-case-study [project]="project" [appReveal]="$index" />
      }
    </app-accordion>
  </div>
</section>
