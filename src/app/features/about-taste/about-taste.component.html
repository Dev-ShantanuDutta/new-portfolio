<section id="about-taste" class="about-taste">
  <app-panel label="About" appReveal>
    @if (identity(); as identity) {
      <div class="about-taste__bio">
        @for (paragraph of identity.bio; track $index) {
          <p>{{ paragraph }}</p>
        }
      </div>
    }
  </app-panel>
